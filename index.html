<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Space – aplikacje</title>
  <meta name="description" content="Open Space – aplikacje mobilne. Mobile apps by Open Space.">
  <style>
    :root {
      --bg: #f5f7fc;
      --card: #ffffff;
      --text: #1b2033;
      --muted: #5b6380;
      --brand: #4a63d8;
      --line: #e1e5f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1424;
        --card: #1b2236;
        --text: #e8ebf5;
        --muted: #a5adc6;
        --brand: #8fa4ff;
        --line: #2b3450;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 2rem; margin: 0 0 4px; }
    .tagline { color: var(--muted); margin: 0 0 32px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    a.app {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      color: inherit;
      text-decoration: none;
      margin-bottom: 12px;
    }
    a.app:hover { border-color: var(--brand); }
    a.app img { width: 56px; height: 56px; border-radius: 14px; }
    a.app strong { display: block; font-size: 1.1rem; }
    a.app span { color: var(--muted); }
    footer { margin-top: 32px; color: var(--muted); }
    footer a { color: var(--brand); }
  </style>
</head>
<body>
<main>
  <h1>Open Space</h1>
  <p class="tagline">Aplikacje mobilne · Mobile apps</p>

  <h2>Aplikacje · Apps</h2>
  <a class="app" href="breath-orbit/">
    <img src="breath-orbit/logo.png" alt="">
    <div>
      <strong>Breath Orbit</strong>
      <span>Ćwiczenia oddechowe · Breathing exercises</span>
    </div>
  </a>

  <footer>
    Kontakt · Contact:
    <a href="mailto:contact@myopenspace.app">contact@myopenspace.app</a>
  </footer>
</main>
</body>
</html>
